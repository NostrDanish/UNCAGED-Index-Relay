image: oven/bun:1

test:
  interruptible: true
  timeout: 10m
  script:
    # Retry once: transient registry/tarball-extraction failures shouldn't
    # fail the pipeline.
    - bun install --frozen-lockfile || bun install --frozen-lockfile
    # --error-on-warnings makes the pipeline fail on lint warnings, not just errors.
    - bunx biome ci --error-on-warnings .
    - bun run typecheck
    - bun test
